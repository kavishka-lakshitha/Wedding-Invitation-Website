    <ellipse cx="1370" cy="150" rx="300" ry="250" fill="url(#gold)"/>
    <ellipse cx="150" cy="930" rx="300" ry="250" fill="url(#blush)"/>
    <ellipse cx="820" cy="520" rx="340" ry="240" fill="url(#gold)" opacity=".55"/>
