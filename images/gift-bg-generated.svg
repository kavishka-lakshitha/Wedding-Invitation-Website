<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Soft ivory, blue and champagne watercolour botanical background">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/>
      <stop offset=".48" stop-color="#F7F1E7"/>
      <stop offset="1" stop-color="#EDF4FB"/>
    </linearGradient>
    <radialGradient id="blue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FB6DE" stop-opacity=".62"/>
      <stop offset=".62" stop-color="#A9C8E6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#A9C8E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D9BE84" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#E4D2B0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#E4D2B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E7C9C0" stop-opacity=".46"/>
      <stop offset="1" stop-color="#E7C9C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".72">
      <stop offset=".6" stop-color="#0A1F44" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1F44" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E7FB8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4E7FB8" stop-opacity=".06"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".055"/>
      </feComponentTransfer>
    </filter>
    <filter id="softEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#base)"/>

