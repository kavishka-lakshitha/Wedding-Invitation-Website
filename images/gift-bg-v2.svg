<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6F1"/>
      <stop offset=".52" stop-color="#EEF3FA"/>
      <stop offset="1" stop-color="#E2ECF8"/>
    </linearGradient>
    <radialGradient id="navyA" cx=".1" cy=".06" r=".62">
      <stop offset="0" stop-color="#17488D" stop-opacity=".2"/>
      <stop offset="1" stop-color="#17488D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="navyB" cx=".92" cy=".94" r=".66">
      <stop offset="0" stop-color="#0A1F44" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0A1F44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx=".8" cy=".1" r=".48">
      <stop offset="0" stop-color="#C9A86A" stop-opacity=".2"/>
      <stop offset="1" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCC492"/>
      <stop offset=".5" stop-color="#C9A86A"/>
      <stop offset="1" stop-color="#A98544"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".045"/>
      </feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#17488D" opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#navyA)"/>
  <rect width="1600" height="1000" fill="url(#navyB)"/>
  <rect width="1600" height="1000" fill="url(#goldGlow)"/>

  <g filter="url(#soft)" opacity=".6">
